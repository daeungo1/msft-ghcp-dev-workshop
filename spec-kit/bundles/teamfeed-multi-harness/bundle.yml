    - "python"
  mcp: []

provides:
  extensions:
    - id: "teamfeed-quality"
      version: "1.0.0"
  workflows:
    - id: "teamfeed-delivery"
      version: "1.0.0"

tags:
  - "copilot"
  - "multi-agent"
  - "quality"
  - "workshop"
