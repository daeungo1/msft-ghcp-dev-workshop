schema_version: "1.0"

bundle:
  id: "teamfeed-multi-harness"
  name: "TeamFeed Multi-Harness"
  version: "1.0.0"
  role: "developer"
  description: "TeamFeed delivery workflow and repository quality gates."
  author: "TeamFeed Workshop"
  license: "MIT"

requires:
  speckit_version: ">=1.2.5"
  tools:
