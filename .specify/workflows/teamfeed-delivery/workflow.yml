schema_version: "1.0"

workflow:
  id: "teamfeed-delivery"
  name: "TeamFeed Evidence-Driven Delivery"
  version: "1.0.0"
  author: "TeamFeed Workshop"
  description: "Runs specification, planning, implementation, verification, and convergence behind human gates."

requires:
  speckit_version: ">=1.2.5"
  integrations:
    any:
      - "copilot"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe the TeamFeed capability to build"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use; auto selects the initialized integration"

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Review requirements, acceptance scenarios, and non-goals before planning."
    options: [approve, reject]
    on_reject: abort

  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Review architecture boundaries, test strategy, and evidence sources."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: confirm-test-contract
    type: gate
    message: "Confirm each acceptance criterion has a failing-test task before implementation."
    options: [approve, reject]
    on_reject: abort

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: verify
    command: speckit.teamfeed-quality.verify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: converge
    command: speckit.converge
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: final-review
    type: gate
    message: "Accept only when verification passes and convergence reports no remaining work."
    options: [approve, reject]
    on_reject: abort
