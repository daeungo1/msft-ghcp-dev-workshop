<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Copilot Fusion routing for the workshop</title>
  <desc id="desc">The participant chooses a Copilot Fusion effort level. Fusion evaluates the task and uses a Single, Cascade, or Critique execution pattern before returning one response that must pass repository quality gates.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Malgun Gothic", sans-serif; fill: #0f172a; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #475569; }
      .heading { font-size: 20px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; fill: #475569; }
      .tag { font-size: 13px; font-weight: 700; fill: #1d4ed8; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="560" rx="20" fill="#f8fafc"/>
  <text x="40" y="58" class="title">Copilot Fusion selects the models and execution pattern</text>
  <text x="40" y="90" class="subtitle">The workshop selects an effort level; Fusion routes the task and returns one response.</text>

  <rect x="40" y="150" width="250" height="264" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="62" y="188" class="heading">1 · Choose effort</text>
  <rect x="62" y="216" width="206" height="48" rx="9" fill="#dbeafe"/>
  <text x="80" y="246" class="label">Fusion Standard</text>
  <rect x="62" y="280" width="206" height="48" rx="9" fill="#eff6ff"/>
  <text x="80" y="310" class="label">Fusion High</text>
  <rect x="62" y="344" width="206" height="48" rx="9" fill="#eff6ff"/>
  <text x="80" y="374" class="label">Fusion Max</text>

  <path d="M290 282H340" class="line"/>

  <rect x="348" y="150" width="250" height="264" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="370" y="188" class="heading">2 · Route task</text>
  <text x="370" y="234" class="label">Copilot Fusion</text>
  <text x="370" y="266" class="body">Task complexity</text>
  <text x="370" y="292" class="body">Model availability</text>
  <text x="370" y="318" class="body">Policy and system health</text>
  <rect x="370" y="348" width="206" height="38" rx="9" fill="#dbeafe"/>
  <text x="390" y="373" class="tag">runtime orchestration</text>

  <path d="M598 282H648" class="line"/>

  <rect x="656" y="150" width="250" height="264" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="678" y="188" class="heading">3 · Execute</text>
  <rect x="678" y="216" width="206" height="48" rx="9" fill="#eff6ff"/>
  <text x="696" y="246" class="label">Single</text>
  <rect x="678" y="280" width="206" height="48" rx="9" fill="#eff6ff"/>
  <text x="696" y="310" class="label">Cascade</text>
  <rect x="678" y="344" width="206" height="48" rx="9" fill="#eff6ff"/>
  <text x="696" y="374" class="label">Critique</text>

  <path d="M906 282H956" class="line"/>

  <rect x="964" y="150" width="196" height="264" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="986" y="188" class="heading">4 · Verify</text>
  <text x="986" y="234" class="label">One response</text>
  <text x="986" y="278" class="body">Tests</text>
  <text x="986" y="304" class="body">Boundaries</text>
  <text x="986" y="330" class="body">Security review</text>
  <text x="986" y="356" class="body">Convergence</text>
  <rect x="986" y="374" width="152" height="24" rx="7" fill="#dbeafe"/>
  <text x="1000" y="391" class="tag">same quality gates</text>

  <rect x="40" y="456" width="1120" height="64" rx="14" fill="#e2e8f0"/>
  <text x="62" y="484" class="label">Workshop default</text>
  <text x="62" y="507" class="body">Standard for daily work · High for security and convergence · Max only for optional deep final audits</text>
</svg>
