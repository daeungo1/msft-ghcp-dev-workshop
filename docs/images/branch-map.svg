<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">TeamFeed v0.1 archive and v0.2 main branch policy</title>
  <desc id="desc">The historical v0.1 checkpoints and final branch are preserved. The current main branch contains the v0.2 multi-harness workshop. No old checkpoint branch is rewritten.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #475569; }
      .heading { font-size: 21px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; fill: #475569; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="650" rx="22" fill="#f8fafc"/>
  <text x="40" y="54" class="title">v0.1은 보존하고, v0.2는 현재 main에서 발전시킵니다</text>
  <text x="40" y="86" class="subtitle">과거 학습 체크포인트를 재작성하지 않으므로 언제든 이전 워크숍과 비교할 수 있습니다</text>

  <rect x="40" y="128" width="1120" height="112" rx="18" fill="#172554"/>
  <text x="66" y="164" class="heading" style="fill:#ffffff">main · TeamFeed Multi-Harness Workshop v0.2</text>
  <text x="66" y="194" class="body" style="fill:#dbeafe">Spec Kit 1.2.5 · 역할 에이전트 · hooks · MCP · CI · extension · workflow · bundle · S6 converge</text>
  <rect x="914" y="158" width="214" height="44" rx="12" fill="#2563eb"/>
  <text x="945" y="186" class="label" style="fill:#ffffff">현재 개발 기준선</text>

  <path d="M600 240V286" class="line"/>

  <rect x="40" y="298" width="1120" height="222" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="66" y="334" class="heading">보존된 v0.1 학습 이력</text>

  <rect x="66" y="364" width="130" height="62" rx="12" fill="#dbeafe"/>
  <text x="87" y="389" class="label">s0-done</text>
  <text x="87" y="412" class="body">명세 기준</text>
  <path d="M196 395H220" class="line"/>
  <rect x="228" y="364" width="130" height="62" rx="12" fill="#dbeafe"/>
  <text x="249" y="389" class="label">s1-done</text>
  <text x="249" y="412" class="body">회원 · 글 · TDD</text>
  <path d="M358 395H382" class="line"/>
  <rect x="390" y="364" width="130" height="62" rx="12" fill="#dbeafe"/>
  <text x="411" y="389" class="label">s2-done</text>
  <text x="411" y="412" class="body">경계 · hooks · CI</text>
  <path d="M520 395H544" class="line"/>
  <rect x="552" y="364" width="130" height="62" rx="12" fill="#dcfce7"/>
  <text x="573" y="389" class="label">s3-done</text>
  <text x="573" y="412" class="body">read-only MCP</text>
  <path d="M682 395H706" class="line"/>
  <rect x="714" y="364" width="130" height="62" rx="12" fill="#dcfce7"/>
  <text x="735" y="389" class="label">s4-done</text>
  <text x="735" y="412" class="body">보안 리뷰</text>
  <path d="M844 395H868" class="line"/>
  <rect x="876" y="364" width="130" height="62" rx="12" fill="#dcfce7"/>
  <text x="897" y="389" class="label">s5-done</text>
  <text x="897" y="412" class="body">plugin 패키징</text>

  <rect x="66" y="450" width="490" height="46" rx="11" fill="#ffffff" stroke="#93c5fd"/>
  <text x="86" y="479" class="label">main-v0.1 · 기존 완성 상태 고정</text>
  <rect x="580" y="450" width="426" height="46" rx="11" fill="#ffffff" stroke="#93c5fd"/>
  <text x="600" y="479" class="label">final · v0.1 회고와 데모</text>

  <rect x="40" y="552" width="544" height="66" rx="14" fill="#ecfdf5" stroke="#86efac"/>
  <text x="62" y="580" class="label">새 참가자</text>
  <text x="62" y="603" class="body">main에서 v0.2 S0-S6 경로를 시작</text>
  <rect x="616" y="552" width="544" height="66" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="638" y="580" class="label">v0.1 비교 또는 기존 강의</text>
  <text x="638" y="603" class="body">main-v0.1, final, sN-done 브랜치를 직접 선택</text>
</svg>
