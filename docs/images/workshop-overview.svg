<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">AI SW Factory MSFT KO workshop overview</title>
  <desc id="desc">The workshop turns application requirements into Spec Kit artifacts, role-based delivery, deterministic quality gates, and an installable GitHub Copilot plugin.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Malgun Gothic", sans-serif; fill: #0f172a; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #475569; }
      .step { font-size: 20px; font-weight: 700; }
      .body { font-size: 15px; fill: #475569; }
      .tag { font-size: 14px; font-weight: 700; fill: #1d4ed8; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="540" rx="20" fill="#f8fafc"/>
  <text x="40" y="58" class="title">From requirements to an installable team harness</text>
  <text x="40" y="90" class="subtitle">Spec Kit artifacts and repeatable evidence turn team practices into a GitHub Copilot plugin.</text>

  <rect x="40" y="142" width="240" height="236" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <circle cx="78" cy="180" r="20" fill="#2563eb"/>
  <text x="72" y="187" class="step" style="fill:#ffffff">1</text>
  <text x="110" y="187" class="step">Specify</text>
  <text x="62" y="232" class="body">constitution</text>
  <text x="62" y="260" class="body">spec + clarify</text>
  <text x="62" y="288" class="body">plan + tasks</text>
  <rect x="62" y="322" width="196" height="34" rx="8" fill="#dbeafe"/>
  <text x="82" y="345" class="tag">Intent before code</text>

  <path d="M280 260H316" class="arrow"/>

  <rect x="324" y="142" width="240" height="236" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <circle cx="362" cy="180" r="20" fill="#2563eb"/>
  <text x="356" y="187" class="step" style="fill:#ffffff">2</text>
  <text x="394" y="187" class="step">Separate roles</text>
  <text x="346" y="232" class="body">research + planning</text>
  <text x="346" y="260" class="body">test + implementation</text>
  <text x="346" y="288" class="body">independent review</text>
  <rect x="346" y="322" width="196" height="34" rx="8" fill="#dbeafe"/>
  <text x="366" y="345" class="tag">Clear ownership</text>

  <path d="M564 260H600" class="arrow"/>

  <rect x="608" y="142" width="240" height="236" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <circle cx="646" cy="180" r="20" fill="#2563eb"/>
  <text x="640" y="187" class="step" style="fill:#ffffff">3</text>
  <text x="678" y="187" class="step">Verify</text>
  <text x="630" y="232" class="body">tests + boundaries</text>
  <text x="630" y="260" class="body">hooks + read-only MCP</text>
  <text x="630" y="288" class="body">CI + convergence</text>
  <rect x="630" y="322" width="196" height="34" rx="8" fill="#dbeafe"/>
  <text x="650" y="345" class="tag">Repeatable evidence</text>

  <path d="M848 260H884" class="arrow"/>

  <rect x="892" y="142" width="268" height="236" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="930" cy="180" r="20" fill="#2563eb"/>
  <text x="924" y="187" class="step" style="fill:#ffffff">4</text>
  <text x="962" y="187" class="step">Package</text>
  <text x="914" y="232" class="body">6 skills + 6 agents</text>
  <text x="914" y="260" class="body">cross-platform hooks</text>
  <text x="914" y="288" class="body">optional SQLite MCP</text>
  <rect x="914" y="322" width="224" height="34" rx="8" fill="#dbeafe"/>
  <text x="932" y="345" class="tag">ai-sw-factory-msft-ko</text>

  <rect x="40" y="424" width="1120" height="76" rx="14" fill="#e2e8f0"/>
  <text x="64" y="455" class="step">Definition of Done</text>
  <text x="64" y="481" class="body">Passing tests, architecture boundaries, independent review, and a clean convergence result — not a model’s completion claim.</text>
</svg>
