  <text x="78" y="239" class="small">Node 22+ · Python 3.12+ · Clean Arch</text>

  <rect x="340" y="202" width="270" height="44" rx="9" fill="#dbeafe"/>
  <text x="356" y="221" class="chip">Delivery Roles + TDD</text>
  <text x="356" y="239" class="small">Copilot Fusion · agents · failing test first</text>

  <rect x="630" y="202" width="288" height="44" rx="9" fill="#dbeafe"/>
  <text x="646" y="221" class="chip">Deterministic Guardrails</text>
  <text x="646" y="239" class="small">hooks · read-only MCP · boundaries · CI</text>

