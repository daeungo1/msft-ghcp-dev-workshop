<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="title desc">
  <title id="title">Spec Kit-based custom Team harness workflow</title>
  <desc id="desc">The official Spec Kit SDD flow remains the core process. A reusable Team Plugin adds runtime, architecture, agents, TDD, hooks, MCP, CI, and Copilot Fusion. A Project Profile adds domain requirements, specifications, instructions, and acceptance criteria. Together they form the custom Team harness.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Malgun Gothic", sans-serif; fill: #0f172a; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #475569; }
      .lane { font-size: 21px; font-weight: 700; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .5px; fill: #2563eb; }
      .step { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; fill: #475569; }
      .small { font-size: 13px; fill: #475569; }
      .chip { font-size: 14px; font-weight: 700; fill: #1d4ed8; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .overlay { fill: none; stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 6 5; marker-end: url(#arrowBlue); }
    </style>
  </defs>

  <rect width="1240" height="760" rx="20" fill="#f8fafc"/>
  <text x="40" y="56" class="title">Spec Kit core + Team Plugin + Project Profile</text>
  <text x="40" y="88" class="subtitle">공식 SDD 흐름은 유지하고, 팀 표준과 프로젝트 규칙을 overlay해 custom Team harness를 만듭니다.</text>

  <rect x="40" y="122" width="900" height="144" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="62" y="151" class="eyebrow">REUSABLE ACROSS PROJECTS</text>
  <text x="62" y="181" class="lane">Team Plugin · ai-sw-factory-msft-ko</text>

