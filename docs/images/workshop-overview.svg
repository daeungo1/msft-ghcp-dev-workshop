<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">AI MSFT Harness Workshop overview</title>
  <desc id="desc">A participant uses the TeamFeed reference application to move through Spec Kit artifacts, role-separated Copilot agents, layered guardrails, convergence, and the reusable ai-msft-harness plugin.</desc>
  <defs>
    <linearGradient id="headerGradient" x1="0" x2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #dbeafe; }
      .step { font-size: 20px; font-weight: 700; }
      .body { font-size: 16px; fill: #334155; }
      .tag { font-size: 14px; font-weight: 700; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="590" rx="22" fill="#f8fafc"/>
  <rect x="28" y="24" width="1144" height="104" rx="18" fill="url(#headerGradient)"/>
  <text x="58" y="68" class="title" style="fill:#ffffff">요구사항을 재사용 가능한 team harness로 바꿉니다</text>
  <text x="58" y="101" class="subtitle">Spec Kit 1.2.5 + role-based agents + deterministic quality gates + installable plugin</text>

  <rect x="38" y="174" width="248" height="252" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <circle cx="76" cy="214" r="22" fill="#2563eb"/>
  <text x="70" y="221" class="step" style="fill:#ffffff">1</text>
  <text x="108" y="221" class="step">Spec baseline</text>
  <text x="60" y="266" class="body">constitution</text>
  <text x="60" y="296" class="body">spec + clarify</text>
  <text x="60" y="326" class="body">plan + tasks</text>
  <rect x="60" y="358" width="184" height="38" rx="10" fill="#dbeafe"/>
  <text x="79" y="383" class="tag" fill="#1e3a8a">Spec Kit artifacts</text>

  <path d="M286 300H326" class="arrow"/>

  <rect x="334" y="174" width="248" height="252" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <circle cx="372" cy="214" r="22" fill="#7c3aed"/>
  <text x="366" y="221" class="step" style="fill:#ffffff">2</text>
  <text x="404" y="221" class="step">Role separation</text>
  <text x="356" y="266" class="body">researcher + planner</text>
  <text x="356" y="296" class="body">test-writer + implementer</text>
  <text x="356" y="326" class="body">security + convergence review</text>
  <rect x="356" y="358" width="204" height="38" rx="10" fill="#ede9fe"/>
  <text x="378" y="383" class="tag" fill="#5b21b6">독립된 책임과 권한</text>

  <path d="M582 300H622" class="arrow"/>

  <rect x="630" y="174" width="248" height="252" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <circle cx="668" cy="214" r="22" fill="#059669"/>
  <text x="662" y="221" class="step" style="fill:#ffffff">3</text>
  <text x="700" y="221" class="step">Guardrails</text>
  <text x="652" y="266" class="body">instructions + skills</text>
  <text x="652" y="296" class="body">hooks + read-only MCP</text>
  <text x="652" y="326" class="body">tests + boundaries + CI</text>
  <rect x="652" y="358" width="204" height="38" rx="10" fill="#d1fae5"/>
  <text x="674" y="383" class="tag" fill="#065f46">Guidance + deterministic checks</text>

  <path d="M878 300H918" class="arrow"/>

  <rect x="926" y="174" width="236" height="252" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <circle cx="964" cy="214" r="22" fill="#ea580c"/>
  <text x="958" y="221" class="step" style="fill:#ffffff">4</text>
  <text x="996" y="221" class="step">Converge + Plugin</text>
  <text x="948" y="266" class="body">verify + converge</text>
  <text x="948" y="296" class="body">human approval gate</text>
  <text x="948" y="326" class="body">ai-msft-harness</text>
  <rect x="948" y="358" width="192" height="38" rx="10" fill="#ffedd5"/>
  <text x="970" y="383" class="tag" fill="#9a3412">VS Code와 CLI에 설치</text>

  <rect x="38" y="468" width="1124" height="84" rx="16" fill="#e2e8f0"/>
  <text x="66" y="501" class="step">Definition of Done</text>
  <text x="66" y="531" class="body">모델의 완료 선언이 아니라 repeatable tests, boundary checks, independent review, convergence result</text>
</svg>
