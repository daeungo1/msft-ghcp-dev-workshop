<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" role="img" aria-labelledby="title desc">
  <title id="title">ai-sw-factory-msft-ko installation flow</title>
  <desc id="desc">The GitHub repository publishes a marketplace catalog and Agent Plugin. Users install through the marketplace, directly from GitHub, or from a local source into Visual Studio Code and Copilot CLI.</desc>
  <defs>
    <linearGradient id="headerGradient" x1="0" x2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #dbeafe; }
      .section { font-size: 20px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; fill: #475569; }
      .code { font-family: "Cascadia Code", "Consolas", monospace; font-size: 13px; fill: #1e3a8a; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1240" height="700" rx="22" fill="#f8fafc"/>
  <rect x="28" y="24" width="1184" height="104" rx="18" fill="url(#headerGradient)"/>
  <text x="58" y="68" class="title" style="fill:#ffffff">Install ai-sw-factory-msft-ko in GitHub Copilot</text>
  <text x="58" y="101" class="subtitle">GitHub marketplace, direct repository, local source를 모두 지원합니다</text>

  <rect x="38" y="168" width="270" height="334" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="62" y="202" class="section">1 · Published source</text>
  <rect x="62" y="228" width="222" height="82" rx="12" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="80" y="256" class="label">GitHub repository</text>
  <text x="80" y="281" class="body">daeungo1/msft-ghcp-dev-workshop</text>
  <rect x="62" y="330" width="222" height="70" rx="12" fill="#dbeafe"/>
  <text x="80" y="358" class="label">Marketplace catalog</text>
  <text x="80" y="382" class="body">.github/plugin/marketplace.json</text>
  <rect x="62" y="420" width="222" height="58" rx="12" fill="#dbeafe"/>
  <text x="80" y="454" class="label">Agent Plugin 2.0.0</text>

  <path d="M308 335H346" class="line"/>

  <rect x="354" y="168" width="278" height="334" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="378" y="202" class="section">2 · Choose install path</text>
  <rect x="378" y="228" width="230" height="78" rx="12" fill="#ede9fe"/>
  <text x="396" y="255" class="label">Marketplace (recommended)</text>
  <text x="396" y="280" class="body">팀 공유, versioned update</text>
  <rect x="378" y="326" width="230" height="70" rx="12" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="396" y="354" class="label">Direct GitHub</text>
  <text x="396" y="378" class="body">repository subdirectory install</text>
  <rect x="378" y="416" width="230" height="62" rx="12" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="396" y="443" class="label">Local source</text>
  <text x="396" y="466" class="body">plugin development and testing</text>

  <path d="M632 335H670" class="line"/>

  <rect x="678" y="168" width="242" height="334" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="702" y="202" class="section">3 · Copilot surface</text>
  <rect x="702" y="228" width="194" height="106" rx="12" fill="#d1fae5"/>
  <text x="720" y="258" class="label">Visual Studio Code</text>
  <text x="720" y="283" class="body">Manage Plugin Marketplaces</text>
  <text x="720" y="307" class="body">Customize → Browse → Install</text>
  <rect x="702" y="354" width="194" height="104" rx="12" fill="#d1fae5"/>
  <text x="720" y="384" class="label">Copilot CLI</text>
  <text x="720" y="409" class="body">marketplace add</text>
  <text x="720" y="433" class="body">plugin install</text>

  <path d="M920 335H958" class="line"/>

  <rect x="966" y="168" width="236" height="334" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="990" y="202" class="section">4 · Installed package</text>
  <text x="990" y="244" class="label">6 Skills</text>
  <text x="990" y="272" class="label">6 Role-based Agents</text>
  <text x="990" y="300" class="label">Cross-platform Hooks</text>
  <text x="990" y="328" class="label">Read-only SQLite MCP</text>
  <text x="990" y="370" class="body">Node.js 22+ / Python 3.12+</text>
  <text x="990" y="396" class="body">Clean Architecture</text>
  <text x="990" y="422" class="body">Incremental refactoring</text>
  <rect x="990" y="444" width="188" height="34" rx="9" fill="#ffedd5"/>
  <text x="1010" y="467" class="body" style="font-weight:700;fill:#9a3412">enabled in Copilot</text>

  <rect x="38" y="542" width="1164" height="120" rx="16" fill="#e2e8f0"/>
  <text x="62" y="576" class="section">Recommended CLI install</text>
  <text x="62" y="607" class="code">copilot plugin marketplace add daeungo1/msft-ghcp-dev-workshop</text>
  <text x="62" y="635" class="code">copilot plugin install ai-sw-factory-msft-ko@ai-sw-factory-msft-ko-marketplace</text>
  <text x="848" y="607" class="label">Verify</text>
  <text x="848" y="635" class="body">plugin list · skill list · mcp list</text>
</svg>
