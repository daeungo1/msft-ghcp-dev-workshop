<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">ai-sw-factory-msft-ko installation flow</title>
  <desc id="desc">A GitHub repository provides marketplace, direct GitHub, and local install paths. Visual Studio Code or Copilot CLI installs the plugin and exposes skills, agents, hooks, and an optional MCP server.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Malgun Gothic", sans-serif; fill: #0f172a; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #475569; }
      .heading { font-size: 20px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; fill: #475569; }
      .code { font-family: "Cascadia Code", "Consolas", monospace; font-size: 13px; fill: #1d4ed8; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="600" rx="20" fill="#f8fafc"/>
  <text x="40" y="58" class="title">Install ai-sw-factory-msft-ko</text>
  <text x="40" y="90" class="subtitle">Choose one source path, install through VS Code or Copilot CLI, then verify the package.</text>

  <rect x="40" y="142" width="250" height="300" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="62" y="180" class="heading">1 · GitHub source</text>
  <rect x="62" y="210" width="206" height="76" rx="10" fill="#eff6ff"/>
  <text x="78" y="240" class="label">Repository</text>
  <text x="78" y="264" class="body">msft-ghcp-dev-workshop</text>
  <rect x="62" y="306" width="206" height="52" rx="10" fill="#dbeafe"/>
  <text x="78" y="338" class="label">Marketplace catalog</text>
  <rect x="62" y="376" width="206" height="44" rx="10" fill="#dbeafe"/>
  <text x="78" y="404" class="label">Plugin 2.0.0</text>

  <path d="M290 292H326" class="line"/>

  <rect x="334" y="142" width="260" height="300" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="356" y="180" class="heading">2 · Install path</text>
  <rect x="356" y="210" width="216" height="58" rx="10" fill="#dbeafe"/>
  <text x="374" y="236" class="label">Marketplace</text>
  <text x="374" y="257" class="body">recommended for teams</text>
  <rect x="356" y="286" width="216" height="58" rx="10" fill="#eff6ff"/>
  <text x="374" y="312" class="label">Direct GitHub</text>
  <text x="374" y="333" class="body">repository subdirectory</text>
  <rect x="356" y="362" width="216" height="58" rx="10" fill="#eff6ff"/>
  <text x="374" y="388" class="label">Local source</text>
  <text x="374" y="409" class="body">development and testing</text>

  <path d="M594 292H630" class="line"/>

  <rect x="638" y="142" width="230" height="300" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="660" y="180" class="heading">3 · Copilot</text>
  <rect x="660" y="210" width="186" height="84" rx="10" fill="#eff6ff"/>
  <text x="678" y="240" class="label">VS Code</text>
  <text x="678" y="264" class="body">Customize → Browse</text>
  <rect x="660" y="314" width="186" height="84" rx="10" fill="#eff6ff"/>
  <text x="678" y="344" class="label">Copilot CLI</text>
  <text x="678" y="368" class="body">marketplace + plugin</text>

  <path d="M868 292H904" class="line"/>

  <rect x="912" y="142" width="248" height="300" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="934" y="180" class="heading">4 · Installed</text>
  <text x="934" y="228" class="label">6 Skills</text>
  <text x="934" y="260" class="label">6 Agents</text>
  <text x="934" y="292" class="label">Cross-platform Hooks</text>
  <text x="934" y="324" class="label">Optional SQLite MCP</text>
  <rect x="934" y="362" width="204" height="58" rx="10" fill="#dbeafe"/>
  <text x="952" y="388" class="body">plugin list · skill list</text>
  <text x="952" y="409" class="body">mcp list</text>

  <rect x="40" y="480" width="1120" height="82" rx="14" fill="#e2e8f0"/>
  <text x="62" y="505" class="label">Recommended CLI path</text>
  <text x="62" y="531" class="code">copilot plugin marketplace add daeungo1/msft-ghcp-dev-workshop</text>
  <text x="62" y="554" class="code">copilot plugin install ai-sw-factory-msft-ko@ai-sw-factory-msft-ko-marketplace</text>
</svg>
