<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc">
  <title id="title">AI SW Factory MSFT KO S0 to S6 workshop workflow</title>
  <desc id="desc">Seven stages move from specification through TDD, guardrails, least-privilege context, security review, plugin packaging, and convergence.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "Malgun Gothic", sans-serif; fill: #0f172a; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #475569; }
      .stage { font-size: 19px; font-weight: 700; }
      .body { font-size: 14px; fill: #475569; }
      .tag { font-size: 13px; font-weight: 700; fill: #1d4ed8; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1240" height="680" rx="20" fill="#f8fafc"/>
  <text x="40" y="56" class="title">S0–S6 workshop path</text>
  <text x="40" y="88" class="subtitle">Each stage exposes one failure mode, adds one harness layer, and records verification evidence.</text>

  <rect x="40" y="118" width="1160" height="58" rx="12" fill="#0f172a"/>
  <text x="64" y="153" style="font-family:'Segoe UI','Malgun Gothic',sans-serif;font-size:16px;font-weight:700;fill:#ffffff">Spec Kit: constitution → specify → clarify → plan → tasks → implement → verify → converge</text>

  <rect x="40" y="218" width="260" height="150" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="62" y="252" class="stage">S0 · Specification</text>
  <text x="62" y="282" class="body">Scope and acceptance criteria</text>
  <text x="62" y="308" class="body">before implementation</text>
  <rect x="62" y="326" width="216" height="26" rx="7" fill="#dbeafe"/>
  <text x="76" y="344" class="tag">constitution · spec · plan · tasks</text>

  <path d="M300 293H326" class="line"/>

  <rect x="334" y="218" width="260" height="150" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="356" y="252" class="stage">S1 · TDD</text>
  <text x="356" y="282" class="body">Separate test and implementation</text>
  <text x="356" y="308" class="body">Commit the failing test first</text>
  <rect x="356" y="326" width="216" height="26" rx="7" fill="#dbeafe"/>
  <text x="370" y="344" class="tag">skills · role-based agents</text>

  <path d="M594 293H620" class="line"/>

  <rect x="628" y="218" width="260" height="150" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="650" y="252" class="stage">S2 · Guardrails</text>
  <text x="650" y="282" class="body">Block boundary violations</text>
  <text x="650" y="308" class="body">and risky commands</text>
  <rect x="650" y="326" width="216" height="26" rx="7" fill="#dbeafe"/>
  <text x="664" y="344" class="tag">import-linter · hooks · CI</text>

  <path d="M888 293H914" class="line"/>

  <rect x="922" y="218" width="278" height="150" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="944" y="252" class="stage">S3 · Context</text>
  <text x="944" y="282" class="body">Inspect the real database schema</text>
  <text x="944" y="308" class="body">with read-only access</text>
  <rect x="944" y="326" width="234" height="26" rx="7" fill="#dbeafe"/>
  <text x="958" y="344" class="tag">least-privilege SQLite MCP</text>

  <path d="M1060 368V402H210V426" class="line"/>

  <rect x="40" y="434" width="340" height="150" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="62" y="468" class="stage">S4 · Security review</text>
  <text x="62" y="498" class="body">Review authorization and input handling</text>
  <text x="62" y="524" class="body">in an independent context</text>
  <rect x="62" y="542" width="296" height="26" rx="7" fill="#dbeafe"/>
  <text x="76" y="560" class="tag">security reviewer · CodeQL · regression tests</text>

  <path d="M380 509H414" class="line"/>

  <rect x="422" y="434" width="340" height="150" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="444" y="468" class="stage">S5 · Package</text>
  <text x="444" y="498" class="body">Version and distribute the harness</text>
  <text x="444" y="524" class="body">for VS Code and Copilot CLI</text>
  <rect x="444" y="542" width="296" height="26" rx="7" fill="#dbeafe"/>
  <text x="458" y="560" class="tag">Agent Plugin · marketplace · validation</text>

  <path d="M762 509H796" class="line"/>

  <rect x="804" y="434" width="396" height="150" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="826" y="468" class="stage">S6 · Converge</text>
  <text x="826" y="498" class="body">Compare specification with current code</text>
  <text x="826" y="524" class="body">and return remaining gaps to tasks</text>
  <rect x="826" y="542" width="352" height="26" rx="7" fill="#dbeafe"/>
  <text x="840" y="560" class="tag">verify → converge → implement → human gate</text>

  <rect x="40" y="622" width="1160" height="34" rx="9" fill="#e2e8f0"/>
  <text x="62" y="645" class="body">Repeat at every stage: observe failure → add one harness layer → rerun → record evidence.</text>
</svg>
