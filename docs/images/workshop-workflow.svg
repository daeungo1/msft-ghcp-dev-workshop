<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" role="img" aria-labelledby="title desc">
  <title id="title">AI MSFT Harness S0 to S6 learning workflow</title>
  <desc id="desc">Seven stages use the TeamFeed reference application to progressively build the ai-msft-harness plugin through specification, role separation, deterministic guardrails, read-only context, independent review, packaging, and convergence.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #475569; }
      .stage { font-size: 20px; font-weight: 700; }
      .body { font-size: 15px; fill: #334155; }
      .chip { font-size: 13px; font-weight: 700; }
      .line { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1240" height="720" rx="22" fill="#f8fafc"/>
  <text x="40" y="54" class="title">TeamFeed 예제로 ai-msft-harness를 단계별로 만듭니다</text>
  <text x="40" y="86" class="subtitle">Spec Kit 개발 단계마다 실패를 관찰하고 팀 개발 패턴을 plugin 자산으로 추출합니다</text>

  <rect x="40" y="126" width="1160" height="64" rx="14" fill="#172554"/>
  <text x="66" y="154" style="fill:#ffffff;font-size:17px;font-weight:700">Spec Kit 실행 축</text>
  <text x="66" y="178" style="fill:#dbeafe;font-size:16px">constitution → specify → clarify → plan → tasks → implement → verify → converge</text>

  <rect x="40" y="236" width="260" height="156" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="62" y="270" class="stage">S0 · 기준 만들기</text>
  <text x="62" y="303" class="body">범위와 수용 기준을 먼저 기록</text>
  <text x="62" y="329" class="body">구현 전에 사람이 검토</text>
  <rect x="62" y="348" width="216" height="28" rx="8" fill="#dbeafe"/>
  <text x="78" y="367" class="chip" fill="#1e3a8a">constitution · spec · plan · tasks</text>

  <path d="M300 314H330" class="line"/>

  <rect x="338" y="236" width="260" height="156" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="360" y="270" class="stage">S1 · 역할과 TDD</text>
  <text x="360" y="303" class="body">테스트 작성자와 구현자 분리</text>
  <text x="360" y="329" class="body">실패 테스트를 먼저 커밋</text>
  <rect x="360" y="348" width="216" height="28" rx="8" fill="#ede9fe"/>
  <text x="376" y="367" class="chip" fill="#5b21b6">skills · custom agents</text>

  <path d="M598 314H628" class="line"/>

  <rect x="636" y="236" width="260" height="156" rx="16" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="658" y="270" class="stage">S2 · 결정적 차단</text>
  <text x="658" y="303" class="body">패키지 내부 접근과 위험 명령 차단</text>
  <text x="658" y="329" class="body">로컬과 PR에서 같은 규칙 검증</text>
  <rect x="658" y="348" width="216" height="28" rx="8" fill="#d1fae5"/>
  <text x="674" y="367" class="chip" fill="#065f46">import-linter · hooks · CI</text>

  <path d="M896 314H926" class="line"/>

  <rect x="934" y="236" width="266" height="156" rx="16" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="956" y="270" class="stage">S3 · 최소 권한 도구</text>
  <text x="956" y="303" class="body">추측 대신 실제 DB 스키마 확인</text>
  <text x="956" y="329" class="body">SELECT만 허용하는 컨텍스트 도구</text>
  <rect x="956" y="348" width="222" height="28" rx="8" fill="#cffafe"/>
  <text x="972" y="367" class="chip" fill="#155e75">read-only SQLite MCP</text>

  <path d="M1067 392V438H170V466" class="line"/>

  <rect x="40" y="474" width="334" height="156" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="62" y="508" class="stage">S4 · 독립 보안 리뷰</text>
  <text x="62" y="541" class="body">작성자와 다른 맥락에서 인가 검토</text>
  <text x="62" y="567" class="body">발견된 결함을 테스트로 고정</text>
  <rect x="62" y="586" width="290" height="28" rx="8" fill="#ffedd5"/>
  <text x="78" y="605" class="chip" fill="#9a3412">security reviewer · CodeQL · 403 tests</text>

  <path d="M374 552H410" class="line"/>

  <rect x="418" y="474" width="334" height="156" rx="16" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="2"/>
  <text x="440" y="508" class="stage">S5 · 팀 단위 패키징</text>
  <text x="440" y="541" class="body">프로세스와 런타임 사용자화 배포</text>
  <text x="440" y="567" class="body">버전과 설치 상태를 명시적으로 관리</text>
  <rect x="440" y="586" width="290" height="28" rx="8" fill="#fce7f3"/>
  <text x="456" y="605" class="chip" fill="#9d174d">extension · workflow · bundle · plugin</text>

  <path d="M752 552H788" class="line"/>

  <rect x="796" y="474" width="404" height="156" rx="16" fill="#fefce8" stroke="#fde047" stroke-width="2"/>
  <text x="818" y="508" class="stage">S6 · 검증과 수렴</text>
  <text x="818" y="541" class="body">체크박스가 아니라 현재 코드와 실행 증거 확인</text>
  <text x="818" y="567" class="body">남은 차이를 tasks에 추가하고 다시 구현</text>
  <rect x="818" y="586" width="360" height="28" rx="8" fill="#fef9c3"/>
  <text x="834" y="605" class="chip" fill="#854d0e">verify → converge → implement loop → human gate</text>

  <rect x="40" y="664" width="1160" height="34" rx="10" fill="#e2e8f0"/>
  <text x="62" y="687" class="body">학습 결과: 기능 구현 능력 + 실패를 드러내고 반복 검증할 수 있는 팀 개발 시스템</text>
</svg>
