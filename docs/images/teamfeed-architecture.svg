<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" role="img" aria-labelledby="title desc">
  <title id="title">TeamFeed reference application and ai-msft-harness architecture</title>
  <desc id="desc">The TeamFeed reference application is separated from the reusable agent workflow and deterministic quality gates. Spec Kit artifacts guide role-separated agents, while hooks, MCP, tests, CI, and convergence become the ai-msft-harness plugin.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#059669"/>
    </marker>
    <style>
      text { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #475569; }
      .section { font-size: 21px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; fill: #475569; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .evidence { fill: none; stroke: #059669; stroke-width: 2.5; stroke-dasharray: 7 5; marker-end: url(#arrowGreen); }
    </style>
  </defs>

  <rect width="1240" height="800" rx="22" fill="#f8fafc"/>
  <text x="38" y="52" class="title">Application runtime, agent workflow, quality gates를 분리합니다</text>
  <text x="38" y="84" class="subtitle">각 layer는 다른 failure mode를 담당하고 execution evidence를 다음 layer에 전달합니다</text>

  <rect x="38" y="122" width="354" height="566" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="62" y="158" class="section">Reference app · TeamFeed</text>
  <rect x="62" y="184" width="306" height="68" rx="12" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="82" y="212" class="label">React + TypeScript</text>
  <text x="82" y="237" class="body">회원 · 글 · 팔로우 · 피드 · 신고 관리</text>
  <path d="M215 252V282" class="line"/>
  <rect x="62" y="290" width="306" height="58" rx="12" fill="#dbeafe"/>
  <text x="82" y="325" class="label">FastAPI routes.py</text>
  <path d="M215 348V378" class="line"/>
  <rect x="62" y="386" width="306" height="58" rx="12" fill="#dbeafe"/>
  <text x="82" y="421" class="label">service.py + security.py</text>
  <path d="M215 444V474" class="line"/>
  <rect x="62" y="482" width="306" height="58" rx="12" fill="#dbeafe"/>
  <text x="82" y="517" class="label">repository.py + SQLAlchemy</text>
  <path d="M215 540V570" class="line"/>
  <rect x="62" y="578" width="306" height="74" rx="12" fill="#172554"/>
  <text x="82" y="610" class="label" style="fill:#ffffff">SQLite</text>
  <text x="82" y="635" class="body" style="fill:#dbeafe">도메인 간 호출은 공개 api.py 경유</text>

  <rect x="426" y="122" width="380" height="566" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="450" y="158" class="section">Spec Kit + Role-based agents</text>
  <rect x="450" y="184" width="332" height="86" rx="12" fill="#ede9fe"/>
  <text x="470" y="214" class="label">의도와 범위</text>
  <text x="470" y="240" class="body">constitution · spec · plan · tasks</text>
  <path d="M616 270V300" class="line"/>
  <rect x="450" y="308" width="332" height="68" rx="12" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="470" y="337" class="label">Researcher → Planner</text>
  <text x="470" y="361" class="body">근거 수집과 실행 가능한 작업 분해</text>
  <path d="M616 376V406" class="line"/>
  <rect x="450" y="414" width="332" height="68" rx="12" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="470" y="443" class="label">Test writer → Implementer</text>
  <text x="470" y="467" class="body">RED 확인 후 최소 구현과 전체 GREEN</text>
  <path d="M616 482V512" class="line"/>
  <rect x="450" y="520" width="332" height="92" rx="12" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="470" y="549" class="label">Independent reviewers</text>
  <text x="470" y="574" class="body">Security + functionality + spec convergence</text>
  <text x="470" y="597" class="body">새 context에서 independent review</text>
  <rect x="450" y="630" width="332" height="36" rx="9" fill="#ddd6fe"/>
  <text x="470" y="654" class="body" style="font-weight:700;fill:#5b21b6">speckit-converge가 남은 작업을 append</text>

  <rect x="840" y="122" width="362" height="566" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="864" y="158" class="section">Multi-layer quality gates</text>
  <rect x="864" y="184" width="314" height="68" rx="12" fill="#d1fae5"/>
  <text x="884" y="213" class="label">Instructions + Skills</text>
  <text x="884" y="237" class="body">지속 규칙과 반복 절차</text>
  <rect x="864" y="274" width="314" height="68" rx="12" fill="#d1fae5"/>
  <text x="884" y="303" class="label">Hooks</text>
  <text x="884" y="327" class="body">Command blocking + post-edit checks</text>
  <rect x="864" y="364" width="314" height="68" rx="12" fill="#d1fae5"/>
  <text x="884" y="393" class="label">Read-only MCP</text>
  <text x="884" y="417" class="body">실제 schema를 read-only로 제공</text>
  <rect x="864" y="454" width="314" height="68" rx="12" fill="#d1fae5"/>
  <text x="884" y="483" class="label">Tests + Boundaries</text>
  <text x="884" y="507" class="body">pytest · Vitest · import-linter · build</text>
  <rect x="864" y="544" width="314" height="68" rx="12" fill="#d1fae5"/>
  <text x="884" y="573" class="label">CI + CodeQL</text>
  <text x="884" y="597" class="body">모든 기여자에게 같은 공유 게이트 적용</text>
  <rect x="864" y="630" width="314" height="36" rx="9" fill="#a7f3d0"/>
  <text x="884" y="654" class="body" style="font-weight:700;fill:#065f46">ai-msft-harness plugin으로 배포</text>

  <path d="M392 414H418" class="line"/>
  <path d="M806 342H832" class="line"/>
  <path d="M840 398H806" class="evidence"/>
  <path d="M840 488H806" class="evidence"/>

  <rect x="38" y="724" width="1164" height="48" rx="12" fill="#e2e8f0"/>
  <text x="62" y="754" class="body" style="font-size:16px">실선: 작업과 요청 흐름 · 점선: 도구와 검증 결과가 에이전트 판단으로 돌아가는 피드백</text>
</svg>
